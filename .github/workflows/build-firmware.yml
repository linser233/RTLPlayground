name: Build firmware

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: debian:trixie

    strategy:
      fail-fast: false
      matrix:
        machine:
          # ⚠️ 先确认 machine/ 目录下的实际文件名，替换这两项
          - SWGT024_V2_0
          - PCB_SWTG024AS_A_2_0_1

    steps:
      - uses: actions/checkout@v6

      - name: Install dependencies
        run: |
          apt update
          apt install make gcc sdcc xxd python-is-python3 \
            libjson-c-dev zlib1g-dev git -y
          sdcc --version

      # 调试用：列出所有机型定义文件，方便核对 MACHINE 名字
      - name: List available machines
        run: ls -1 machine/*.c

      - name: Run the host-side unit tests
        if: matrix.machine == 'SWGT024_V2_0'
        run: make -C test

      - name: Check that every machine definition can be compiled
        if: matrix.machine == 'SWGT024_V2_0'
        run: make machine_check

      - name: Make project (${{ matrix.machine }})
        run: make clean && make CI=1 MACHINE="${{ matrix.machine }}"

      - name: Save standard firmware
        run: |
          mkdir -p artifacts/${{ matrix.machine }}
          cp output/rtlplayground.bin \
             artifacts/${{ matrix.machine }}/rtlplayground-${{ matrix.machine }}.bin

      - name: Make installer (${{ matrix.machine }})
        run: |
          cd installer
          make clean && make CI=1 MACHINE="${{ matrix.machine }}"

      - name: Save installer firmware
        run: |
          cp installer/output/rtlplayground_oem_upgrade.bin \
             artifacts/${{ matrix.machine }}/rtlplayground_oem_upgrade-${{ matrix.machine }}.bin

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.machine }}
          path: artifacts/${{ matrix.machine }}/
          retention-days: 30
