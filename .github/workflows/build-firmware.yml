name: Build firmware

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: debian:trixie

    strategy:
      fail-fast: false
      matrix:
        machine:
          - PCB_SWTG024AS_A_2_0_1
          - SWTG024AS_V2_0
          - SWGT024_V2_0_MANAGED

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0            # 让 make 里的 git describe 能拿到 tag
          set-safe-directory: false # 不让 checkout 自己塞 safe.directory，下面统一管理

      - name: Install dependencies
        run: |
          apt update
          apt install make gcc sdcc xxd python-is-python3 \
            libjson-c-dev zlib1g-dev git curl -y   # ← 加了 curl
          sdcc --version

      - name: Fix git ownership
        run: |
          git config --system --add safe.directory '*'  # ← --system + 通配符
          echo "== safe.directory =="
          git config --list --show-origin | grep -i safe || true
          echo "== .git exists? =="
          ls -la "$GITHUB_WORKSPACE/.git" 2>&1 | head -5 || true

      # 校验只跑一次，避免两个矩阵项重复执行
      - name: Run the host-side unit tests
        if: matrix.machine == 'PCB_SWTG024AS_A_2_0_1'
        run: make -C test

      - name: Check that every machine definition can be compiled
        if: matrix.machine == 'PCB_SWTG024AS_A_2_0_1'
        run: make machine_check

      # ---- 标准固件 ----
      - name: Make project (${{ matrix.machine }})
        run: |
          make clean || true
          make CI=1 MACHINE="${{ matrix.machine }}"
          mkdir -p artifacts/${{ matrix.machine }}
          cp output/rtlplayground.bin \
             artifacts/${{ matrix.machine }}/rtlplayground-${{ matrix.machine }}.bin

      # ---- installer 固件 ----
      - name: Make installer (${{ matrix.machine }})
        run: |
          cd installer
          make clean || true
          make CI=1 MACHINE="${{ matrix.machine }}"

      - name: Save installer firmware
        run: |
          cp installer/output/rtlplayground_oem_upgrade.bin \
             artifacts/${{ matrix.machine }}/rtlplayground_oem_upgrade-${{ matrix.machine }}.bin

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.machine }}
          path: artifacts/${{ matrix.machine }}/
          retention-days: 30
