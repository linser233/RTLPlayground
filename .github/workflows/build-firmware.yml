name: Build firmware

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: debian:trixie

    strategy:
      fail-fast: false
      matrix:
        machine:
          - PCB_SWTG024AS_A_2_0_1
          - SWTG024AS_V2_0
          - SWGT024_V2_0_MANAGED

    steps:
      # ⚠️ checkout 必须在前：容器里没 git → 走 REST 下载 → 不会触发 dubious ownership
      - uses: actions/checkout@v4

      # ⚠️ 装依赖必须在 checkout 之后：bzip2 / curl / ca-certificates 缺一不可
      - name: Install dependencies
        run: |
          apt update
          apt install make gcc g++ bison flex libboost-dev patch \
            bzip2 curl ca-certificates xxd python-is-python3 \
            libjson-c-dev zlib1g-dev -y
          sdcc --version

      - name: Cache the patched SDCC
        uses: actions/cache@v4
        with:
          path: toolchain
          key: sdcc-${{ hashFiles('sdcc/*') }}

      # 校验只跑一次，避免三台机器重复执行
      - name: Run the host-side unit tests
        if: matrix.machine == 'PCB_SWTG024AS_A_2_0_1'
        run: make -C test

      - name: Check that every machine definition can be compiled
        if: matrix.machine == 'PCB_SWTG024AS_A_2_0_1'
        run: make machine_check

      # ---------- 标准固件 ----------
      - name: Build firmware (${{ matrix.machine }})
        run: |
          make clean || true
          make CI=1 MACHINE="${{ matrix.machine }}"
          mkdir -p artifacts/${{ matrix.machine }}
          cp output/rtlplayground.bin \
             artifacts/${{ matrix.machine }}/rtlplayground-${{ matrix.machine }}.bin

      # ---------- installer 固件 ----------
      - name: Build installer (${{ matrix.machine }})
        run: |
          cd installer
          make clean || true
          make CI=1 MACHINE="${{ matrix.machine }}"

      - name: Save installer firmware
        run: |
          cp installer/output/rtlplayground_oem_upgrade.bin \
             artifacts/${{ matrix.machine }}/rtlplayground_oem_upgrade-${{ matrix.machine }}.bin

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.machine }}
          path: artifacts/${{ matrix.machine }}/
          retention-days: 30
