name: Build firmware

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: debian:trixie

    strategy:
      fail-fast: false
      matrix:
        machine:
          - PCB_SWTG024AS_A_2_0_1
          - SWTG024AS_V2_0
          - SWGT024_V2_0_MANAGED

    steps:
      # ① 先安装 git，确保 checkout 会走真正的 git clone 而不是 REST 下载
      - name: Install git & basic tools
        run: |
          apt update
          apt install -y git curl bzip2 ca-certificates

      # ② 关键：在 checkout 之前，用 --system 作用域标记工作区为安全目录
      - name: Mark workspace as safe directory (system-level)
        run: |
          git config --system --add safe.directory '*'
          echo "safe.directory configured:"
          git config --list --show-origin | grep -i safe || true

      # ③ 现在 checkout 内部的 git 命令不会再报 dubious ownership
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          set-safe-directory: false   # 避免 checkout 自带的 global 配置与我们冲突

      # ④ 其余构建依赖
      - name: Install build dependencies
        run: |
          apt install -y make gcc sdcc xxd python-is-python3 \
            libjson-c-dev zlib1g-dev
          sdcc --version

      # ⑤ 验证 git 环境（诊断用）
      - name: Verify git environment
        run: |
          git rev-parse --show-toplevel
          git describe --tags --always || true
          git config --list --show-origin | grep -i safe || true

      # 校验只跑一次，避免矩阵项重复执行
      - name: Run the host-side unit tests
        if: matrix.machine == 'PCB_SWTG024AS_A_2_0_1'
        run: make -C test

      - name: Check that every machine definition can be compiled
        if: matrix.machine == 'PCB_SWTG024AS_A_2_0_1'
        run: make machine_check

      # ---- 标准固件 ----
      - name: Make project (${{ matrix.machine }})
        run: |
          make clean || true
          make CI=1 MACHINE="${{ matrix.machine }}"
          mkdir -p artifacts/${{ matrix.machine }}
          cp output/rtlplayground.bin \
             artifacts/${{ matrix.machine }}/rtlplayground-${{ matrix.machine }}.bin

      # ---- installer 固件 ----
      - name: Make installer (${{ matrix.machine }})
        run: |
          cd installer
          make clean || true
          make CI=1 MACHINE="${{ matrix.machine }}"

      - name: Save installer firmware
        run: |
          cp installer/output/rtlplayground_oem_upgrade.bin \
             artifacts/${{ matrix.machine }}/rtlplayground_oem_upgrade-${{ matrix.machine }}.bin

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.machine }}
          path: artifacts/${{ matrix.machine }}/
          retention-days: 30
