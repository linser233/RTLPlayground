name: Build RTLPlayground Firmware

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    name: Build ${{ matrix.machine }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        machine:
          - SWTG024AS
          - SWTG024AS_V2_0

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # 构建 Docker 镜像（一次构建，本 job 内所有 step 复用）
      - name: Build Docker image
        run: |
          docker build -t rtlplayground-build .

      # 编译标准固件
      - name: Build standard firmware
        run: |
          docker run --rm \
            -v "$PWD:/workspace" -w /workspace \
            rtlplayground-build \
            bash -c "make clean && make MACHINE=${{ matrix.machine }}"
          mkdir -p artifacts/${{ matrix.machine }}
          cp output/rtlplayground.bin \
             artifacts/${{ matrix.machine }}/rtlplayground-${{ matrix.machine }}.bin

      # 编译 installer 固件
      - name: Build installer firmware
        run: |
          docker run --rm \
            -v "$PWD:/workspace" -w /workspace/installer \
            rtlplayground-build \
            bash -c "make clean && make MACHINE=${{ matrix.machine }}"
          cp installer/output/rtlplayground_oem_upgrade.bin \
             artifacts/${{ matrix.machine }}/rtlplayground_oem_upgrade-${{ matrix.machine }}.bin

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.machine }}
          path: artifacts/${{ matrix.machine }}/
          retention-days: 30
