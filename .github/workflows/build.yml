name: Build firmware

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: debian:trixie

    steps:
      - uses: actions/checkout@v6
        with:
          path: branch

      - uses: actions/checkout@v6
        with:
          path: main
          ref: main

      - name: Install dependencies
        run: |
          apt update
          apt install make gcc g++ pkg-config bison flex libboost-dev patch bzip2 curl ca-certificates xxd python-is-python3 libjson-c-dev zlib1g-dev -y

      - name: Cache the patched SDCC
        uses: actions/cache@v4
        with:
          path: branch/toolchain
          key: sdcc-${{ hashFiles('branch/sdcc/*') }}

      - name: Run the host-side unit tests
        run: cd branch && make -C test

      - name: Check that every machine definition can be compiled
        run: cd branch && make machine_check

      - name: Build firmware
        run: |
          set -e
          mkdir -p artifacts
          for MACHINE in HI_K0402WS SWGT024_V2_0_MANAGED PCB_SWTG024AS_A_2_0_1; do
            echo "=== Building $MACHINE ==="
            make -C branch clean || true
            make -C branch CI=1 MACHINE="$MACHINE"
            mkdir -p "artifacts/$MACHINE"
            cp branch/output/"$MACHINE"/*.bin "artifacts/$MACHINE/"
          done

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: artifacts/**/*.bin
          if-no-files-found: error
